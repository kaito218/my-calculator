<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>割り勘計算</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      color: #111;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 {
      margin: 8px 0 20px;
      font-size: 28px;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-weight: 700;
      margin: 14px 0 7px;
    }
    input, select {
      width: 100%;
      font-size: 20px;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      background: #111;
      color: white;
    }
    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      background: #f7f7f7;
      text-align: center;
    }
    .result .big {
      font-size: 36px;
      font-weight: 800;
      margin: 8px 0;
    }
    .sub {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    .details {
      margin-top: 14px;
      text-align: left;
      font-size: 15px;
      line-height: 1.7;
    }
    .error {
      color: #b00020;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>割り勘計算</h1>

    <div class="card">
      <label for="total">合計金額</label>
      <input id="total" type="number" inputmode="numeric" min="0" placeholder="例：12800" />

      <label for="people">人数</label>
      <input id="people" type="number" inputmode="numeric" min="1" placeholder="例：4" />

      <label for="rounding">端数調整</label>
      <select id="rounding">
        <option value="1">1円単位</option>
        <option value="10">10円単位で切り上げ</option>
        <option value="100" selected>100円単位で切り上げ</option>
        <option value="1000">1000円単位で切り上げ</option>
      </select>

      <button onclick="calculate()">計算する</button>

      <div id="result" class="result">
        <div class="sub">金額と人数を入力してください</div>
      </div>
    </div>
  </div>

  <script>
    function yen(n) {
      return new Intl.NumberFormat('ja-JP').format(n) + '円';
    }

    function calculate() {
      const total = Number(document.getElementById('total').value);
      const people = Number(document.getElementById('people').value);
      const unit = Number(document.getElementById('rounding').value);
      const result = document.getElementById('result');

      if (!total || total <= 0) {
        result.innerHTML = '<div class="error">合計金額を入力してください</div>';
        return;
      }

      if (!people || people < 1 || !Number.isInteger(people)) {
        result.innerHTML = '<div class="error">人数は1人以上の整数で入力してください</div>';
        return;
      }

      const exact = total / people;
      const perPerson = unit === 1 ? Math.ceil(exact) : Math.ceil(exact / unit) * unit;
      const collected = perPerson * people;
      const difference = collected - total;

      result.innerHTML = `
        <div class="sub">1人あたり</div>
        <div class="big">${yen(perPerson)}</div>
        <div class="details">
          合計金額：${yen(total)}<br>
          人数：${people}人<br>
          正確な割り勘：${yen(Math.round(exact))} / 人<br>
          集金合計：${yen(collected)}<br>
          余り：${yen(difference)}
        </div>
      `;
    }
  </script>
</body>
</html>
